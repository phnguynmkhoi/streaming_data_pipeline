table_name: revenue_over_time
main_dttm_col: ts
description: null
default_endpoint: null
offset: 0
cache_timeout: null
schema: serving
sql: "SELECT date_parse(t.last_modified_ts, '%Y-%m-%d %H:%i:%s.%f') AS ts,\n     \
  \  t.quantity * p.unit_price * (1 - t.discount / 100.0) AS revenue,\n       t.quantity\
  \ AS quantity,\n       p.category AS category\nFROM iceberg.serving.transactions\
  \ t\nJOIN iceberg.serving.products p ON p.product_id = t.product_id"
