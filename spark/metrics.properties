# Exposes Spark metrics in Prometheus format (PLAN.md 4.1). Built into Spark
# 3.x -- no exporter needed. Paths are made uniform so one scrape config
# covers master, workers and the driver; by default the master would use
# /metrics/master/prometheus instead.
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus
master.sink.prometheusServlet.path=/metrics/prometheus
applications.sink.prometheusServlet.path=/metrics/prometheus
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
