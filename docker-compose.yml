x-spark-worker-common: 
  &spark-common
  image: spark-cluster:3.1.3
  environment:
    - SPARK_MASTER=spark://spark-master:7077
    - SPARK_WORKER_CORES=2
    - SPARK_WORKER_MEMORY=2G
    - SPARK_DRIVER_MEMORY=2G
    - SPARK_EXECUTOR_MEMORY=2G
    - SPARK_WORKLOAD=worker
    - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
    - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
  volumes:
    - ./apps:/opt/spark/spark-apps
    - ./spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
  mem_limit: 2g
  depends_on:
    - spark-master
  networks:
    - streamingnetwork

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - '2181:2181'
    mem_limit: 512m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: '-Xmx256m'
    healthcheck:
      test: echo srvr | nc zookeeper 2181 || exit 1
      start_period: 10s
      retries: 20
      interval: 10s
    networks:
      - streamingnetwork

  broker:
    image: confluentinc/cp-kafka:7.4.0
    hostname: broker
    container_name: broker
    ports:
      - '29092:29092'
      - '9092:9092'
      - '9101:9101'
    mem_limit: 1500m
    volumes:
      - ./monitoring/jmx:/opt/jmx:ro
    environment:
      KAFKA_HEAP_OPTS: '-Xmx1g'
      # Prometheus JMX exporter (script/download_jmx_exporter.sh)
      KAFKA_OPTS: '-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/kafka.yml'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      CLUSTER_ID: 'eVe-GRdtRNyA5Xi3Cvh5Dw'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - streamingnetwork

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.4.0
    hostname: control-center
    container_name: control-center
    profiles: ['tools']
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "9021:9021"
    mem_limit: 2g
    environment:
      CONTROL_CENTER_HEAP_OPTS: '-Xmx1g'
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONFLuENT_METRICS_ENABLE: 'true'
      PORT: 9021
    networks:
      - streamingnetwork
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9021/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - '8081:8081'
    mem_limit: 768m
    environment:
      SCHEMA_REGISTRY_HEAP_OPTS: '-Xmx512m'
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:8081/subjects' ]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamingnetwork

  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium
    mem_limit: 1500m
    hostname: debezium
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - '8093:8083'
    volumes:
      # kafka-connect-avro-converter isn't bundled in this image -- populate
      # via script/download_debezium_avro_plugin.sh (PLAN.md 3.2). The
      # image's default plugin.path already scans /kafka/connect, so this
      # subdirectory is picked up automatically.
      - ./debezium-plugins/kafka-connect-avro-converter:/kafka/connect/kafka-connect-avro-converter
      - ./monitoring/jmx:/opt/jmx:ro
    environment:
      KAFKA_HEAP_OPTS: '-Xmx1g'
      # Exports connector/task status so a FAILED task alerts even while the
      # connector itself reports RUNNING (the 3.2 failure mode).
      KAFKA_OPTS: '-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/connect.yml'
      BOOTSTRAP_SERVERS: broker:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      STATUS_STORAGE_TOPIC: connect_statuses
      OFFSET_STORAGE_TOPIC: connect_offsets
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      ENABLE_DEBEZIUM_SCRIPTING: 'false'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [ 'CMD', 'curl', '--silent', '--fail', '-X', 'GET', 'http://localhost:8083/connectors', ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamingnetwork

  debezium-ui:
    image: debezium/debezium-ui:2.5
    container_name: debezium-ui
    profiles: ['tools']
    hostname: debezium-ui
    depends_on:
      debezium:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    networks:
      - streamingnetwork

  postgres:
    image: postgres:latest
    container_name: postgres
    mem_limit: 768m
    hostname: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions_db
    command: [ 'postgres', '-c', 'wal_level=logical' ]
    healthcheck:
      test: [ 'CMD', 'psql', '-U', 'postgres', '-c', 'SELECT 1' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamingnetwork
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    container_name: minio
    mem_limit: 1g
    environment:
      MINIO_ROOT_USER: minioadmin         # Default access key (change it)
      MINIO_ROOT_PASSWORD: minioadmin     # Default secret key (change it)
      MINIO_PROMETHEUS_AUTH_TYPE: public  # lets Prometheus scrape /minio/v2/metrics without a token
    ports:
      - "10000:9000"   # MinIO API port
      - "10001:9001"   # MinIO console port
    volumes:
      - minio-volume:/data
    command: server /data --console-address ":9001"
    networks:
      - streamingnetwork

  spark-master:
    image: spark-cluster:3.1.3
    container_name: spark-master
    mem_limit: 2500m
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    ports:
      - "9090:8080"
      - "7077:7077"
      - "4040-4060:4040-4060"
    volumes:
      - ./apps:/opt/spark/spark-apps
      - ./spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
    networks:
      - streamingnetwork

  spark-worker-a:
    <<: *spark-common
    container_name: worker-a
    ports:
      - "9091:8080"
      - "7000:7000"
  
  spark-worker-b:
    <<: *spark-common
    container_name: worker-b
    ports:
      - "9093:8080"
      - "7001:7000"
  
  pinot-controller:
    image: apachepinot/pinot
    command: "StartController -zkAddress zookeeper:2181 -controllerHost pinot-controller"
    container_name: "pinot-controller"
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "9000:9000"
    environment:
      JAVA_OPTS: "-javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=8008:/opt/pinot/etc/jmx_prometheus_javaagent/configs/controller.yml -Dplugins.dir=/opt/pinot/plugins -Xms128M -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xloggc:gc-pinot-controller.log"
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - streamingnetwork
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  pinot-broker:
    image: apachepinot/pinot
    command: "StartBroker -zkAddress zookeeper:2181 -brokerHost pinot-broker"
    container_name: "pinot-broker"
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "8099:8099"
    environment:
      JAVA_OPTS: "-javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=8008:/opt/pinot/etc/jmx_prometheus_javaagent/configs/broker.yml -Dplugins.dir=/opt/pinot/plugins -Xms128M -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xloggc:gc-pinot-broker.log"
    depends_on:
      pinot-controller:
        condition: service_healthy
    networks:
      - streamingnetwork
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  pinot-server:
    image: apachepinot/pinot 
    command: "StartServer -zkAddress zookeeper:2181 -serverHost pinot-server"
    container_name: "pinot-server"
    restart: unless-stopped
    mem_limit: 2500m
    ports:
      - "8098:8098"
    environment:
      JAVA_OPTS: "-javaagent:/opt/pinot/etc/jmx_prometheus_javaagent/jmx_prometheus_javaagent.jar=8008:/opt/pinot/etc/jmx_prometheus_javaagent/configs/server.yml -Dplugins.dir=/opt/pinot/plugins -Xms512M -Xmx1500m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xloggc:gc-pinot-server.log"
    depends_on:
      pinot-broker:
        condition: service_healthy
    networks:
      - streamingnetwork
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8097/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: iceberg-rest
    hostname: iceberg-rest
    mem_limit: 384m
    depends_on:
      - minio
    ports:
      - '8181:8181'
    environment:
      # The image only bundles a SQLite driver and defaults to /tmp, which
      # would forget every table on restart -- keep the file on a volume.
      CATALOG_URI: jdbc:sqlite:/home/iceberg/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: us-east-1
    volumes:
      - iceberg-catalog:/home/iceberg
    networks:
      - streamingnetwork

  trino:
    image: trinodb/trino:483
    container_name: trino
    hostname: trino
    depends_on:
      iceberg-rest:
        condition: service_healthy
    ports:
      - '8088:8080'
    # Trino's default heap is 80% of available memory -- on this 15 GB VM
    # that would starve everything else (PLAN.md 5.2).
    mem_limit: 1500m
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    networks:
      - streamingnetwork

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    hostname: prometheus
    ports:
      - '9099:9090'   # 9090 on the host is already Spark master's UI
    mem_limit: 768m
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - streamingnetwork

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    hostname: alertmanager
    ports:
      # 9093 on the host is taken by spark worker-b's UI
      - '9094:9093'
    mem_limit: 192m
    volumes:
      # Rendered from the tracked template by script/render_alertmanager_config.sh
      # -- it holds the SMTP app password, so it is gitignored.
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - streamingnetwork

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana
    hostname: grafana
    depends_on:
      - prometheus
    ports:
      - '3000:3000'
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - streamingnetwork

volumes:
  minio-volume:
  postgres_data:
  iceberg-catalog:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  streamingnetwork:
    name: streamingnetwork
    driver: bridge